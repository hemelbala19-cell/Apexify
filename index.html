<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apexify - Sign In / Sign Up</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-container { max-width: 400px; margin: 80px auto; padding: 30px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; font-size: 14px; color: #9CA3AF; }
        .input-group input { width: 100%; padding: 10px; background: var(--bg-main); border: 1px solid var(--border-color); color: var(--text-main); border-radius: 6px; }
        .btn-primary { width: 100%; padding: 10px; background: var(--brand-blue); border: none; color: white; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .switch-text { text-align: center; margin-top: 15px; font-size: 14px; color: #9CA3AF; }
        .switch-text span { color: var(--brand-blue); cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div class="auth-container">
        <h2 id="form-title" style="margin-bottom: 5px;">Sign In to <span style="color: var(--brand-blue);">Apexify</span></h2>
        <p id="form-subtitle" style="color: #9CA3AF; font-size: 14px; margin-bottom: 20px;">Enter your details to access your dashboard</p>
        
        <form id="authForm">
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="email" required placeholder="name@example.com">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-primary" id="submit-btn">Sign In</button>
        </form>

        <div class="switch-text" id="switch-text">
            Don't have an account? <span id="switch-btn">Sign Up</span>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDsgQJgZ64-ARLqKa3vcdQpu_xVupD90W4",
          authDomain: "apexify-72bc2.firebaseapp.com",
          projectId: "apexify-72bc2",
          storageBucket: "apexify-72bc2.firebasestorage.app",
          messagingSenderId: "114061131405",
          appId: "1:114061131405:web:ffd00b701d70c164976cc4",
          measurementId: "G-RB6KW4S7JL"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // ইউআরএল থেকে রেফারেল কোড চেক করা
        const urlParams = new URLSearchParams(window.location.search);
        const refId = urlParams.get("ref") || "";

        const authForm = document.getElementById("authForm");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const formTitle = document.getElementById("form-title");
        const formSubtitle = document.getElementById("form-subtitle");
        const submitBtn = document.getElementById("submit-btn");
        const switchText = document.getElementById("switch-text");
        const switchBtn = document.getElementById("switch-btn");

        let isSignUp = false;

        switchBtn.addEventListener("click", () => {
            isSignUp = !isSignUp;
            if (isSignUp) {
                formTitle.innerHTML = `Create Account on <span style="color: var(--brand-blue);">Apexify</span>`;
                formSubtitle.innerText = "Register to start your journey";
                submitBtn.innerText = "Sign Up";
                switchText.innerHTML = `Already have an account? <span id="switch-btn">Sign In</span>`;
            } else {
                formTitle.innerHTML = `Sign In to <span style="color: var(--brand-blue);">Apexify</span>`;
                formSubtitle.innerText = "Enter your details to access your dashboard";
                submitBtn.innerText = "Sign In";
                switchText.innerHTML = `Don't have an account? <span id="switch-btn">Sign Up</span>`;
            }
        });

        authForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = emailInput.value;
            const password = passwordInput.value;

            try {
                if (isSignUp) {
                    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                    const user = userCredential.user;

                    // ডাটাবেসে ইউজার সেভ (রেফারেল আইডি সহ)
                    await setDoc(doc(db, "users", user.uid), {
                        uid: user.uid,
                        email: email,
                        role: "user",
                        accountStatus: "Inactive",
                        balance: 0,
                        availableBalance: 0,
                        qualifiedReferrals: 0,
                        referredBy: refId || null,
                        createdAt: new Date().toISOString()
                    });

                    alert("সফলভাবে অ্যাকাউন্ট রেজিস্টার হয়েছে!");
                    window.location.href = "dashboard.html";
                } else {
                    await signInWithEmailAndPassword(auth, email, password);
                    alert("লগইন সফল হয়েছে!");
                    window.location.href = "dashboard.html";
                }
            } catch (error) {
                alert("ত্রুটি: " + error.message);
            }
        });
    </script>
</body>
    </html>

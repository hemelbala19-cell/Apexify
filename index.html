<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apexify - Deposit</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .container { max-width: 500px; margin: 20px auto; padding: 15px; }
        .card { background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: var(--text-main); }
        .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 10px; box-sizing: border-box; font-size: 14px; }
        .submit-btn { width: 100%; background: var(--brand-green); color: white; border: none; padding: 14px; border-radius: 10px; font-weight: bold; font-size: 15px; cursor: pointer; }
        .back-link { display: inline-block; margin-bottom: 15px; color: var(--brand-green); text-decoration: none; font-weight: 600; font-size: 14px; }
    </style>
</head>
<body>

    <div class="container">
        <a href="wallet.html" class="back-link">← Back to Wallet</a>
        
        <div class="card">
            <h2>Deposit Money</h2>
            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 20px;">বিকাশ বা নগদ এর মাধ্যমে আপনার মেইন ব্যালেন্সে টাকা অ্যাড করুন।</p>

            <div class="form-group">
                <label>Payment Method</label>
                <select id="payMethod">
                    <option value="bkash">bKash (Personal)</option>
                    <option value="nagad">Nagad (Personal)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Amount (BDT)</label>
                <input type="number" id="depAmount" placeholder="Enter amount (e.g. 500)">
            </div>

            <div class="form-group">
                <label>Sender Mobile Number</label>
                <input type="text" id="senderNum" placeholder="01XXXXXXXXX">
            </div>

            <div class="form-group">
                <label>Transaction ID (TrxID)</label>
                <input type="text" id="trxId" placeholder="Enter TrxID">
            </div>

            <button class="submit-btn" id="submitDeposit">Submit Deposit</button>
        </div>
    </div>

    <!-- বটম ন্যাভিগেশন বার -->
    <div class="bottom-nav">
        <a href="dashboard.html" class="nav-item">🏠 Home</a>
        <a href="wallet.html" class="nav-item active">👛 Wallet</a>
        <a href="server.html" class="nav-center-btn">⚡</a>
        <a href="server.html" class="nav-item">👑 Server</a>
        <a href="profile.html" class="nav-item">👤 Profile</a>
    </div>

    <script>
        document.getElementById("submitDeposit").addEventListener("click", () => {
            const amount = document.getElementById("depAmount").value;
            const trx = document.getElementById("trxId").value;
            
            if(!amount || !trx) {
                alert("দয়া করে অ্যামাউন্ট এবং ট্রানজেকশন আইডি দিন!");
                return;
            }
            
            alert("আপনার ডিপোজিট রিকোয়েস্ট সফলভাবে সাবমিট হয়েছে। কিছুক্ষণের মধ্যে যাচাই করে ব্যালেন্স যুক্ত করা হবে।");
            window.location.href = "wallet.html";
        });
    </script>
</body>
        </html>

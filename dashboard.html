<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apexify - Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .container { max-width: 500px; margin: 15px auto; padding: 15px; }
        .top-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .brand-title { font-size: 22px; font-weight: bold; color: var(--brand-green); }
        .alert-box { background: #FEF2F2; border: 1px solid #FCA5A5; padding: 15px; border-radius: 16px; text-align: center; margin-bottom: 20px; }
        .alert-title { color: #DC2626; font-weight: bold; font-size: 16px; margin-bottom: 5px; }
        .alert-desc { color: #4B5563; font-size: 12px; margin-bottom: 12px; line-height: 1.4; }
        .activate-btn { background: #E11D48; color: white; border: none; padding: 10px 20px; border-radius: 25px; font-weight: bold; font-size: 13px; cursor: pointer; }
        .asset-card { background: linear-gradient(135deg, #0A192F 0%, #0F766E 100%); color: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 20px rgba(15, 118, 110, 0.2); }
        .asset-title { font-size: 12px; opacity: 0.8; letter-spacing: 0.5px; }
        .asset-amount { font-size: 32px; font-weight: bold; margin: 5px 0 15px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="top-header">
            <div class="brand-title">📈 Apexify</div>
            <div id="userGreeting" style="font-size: 13px; font-weight: 600; color: var(--text-muted);">Loading...</div>
        </div>

        <div class="alert-box">
            <div class="alert-title">⚠️ Action Required!</div>
            <div class="alert-desc">আপনার অ্যাকাউন্ট ইনঅ্যাক্টিভ, কাজ শুরু করতে এবং উইথড্র পেতে এখনই অ্যাকাউন্টটি একটিভ করুন।</div>
            <button class="activate-btn" onclick="window.location.href='wallet.html'">⚡ ACCOUNT ACTIVE</button>
        </div>

        <div class="asset-card">
            <div class="asset-title">TOTAL ASSET VALUE</div>
            <div class="asset-amount">৳<span id="dashBalance">0.00</span></div>
            <div style="font-size: 12px; opacity: 0.7;">Your complete Apexify account summary</div>
        </div>
    </div>

    <!-- বটম ন্যাভিগেশন বার -->
    <div class="bottom-nav">
        <a href="dashboard.html" class="nav-item active">🏠 Home</a>
        <a href="wallet.html" class="nav-item">👛 Wallet</a>
        <a href="server.html" class="nav-center-btn">⚡</a>
        <a href="server.html" class="nav-item">👑 Server</a>
        <a href="profile.html" class="nav-item">👤 Profile</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDsgQJgZ64-ARLqKa3vcdQpu_xVupD90W4",
          authDomain: "apexify-72bc2.firebaseapp.com",
          projectId: "apexify-72bc2",
          storageBucket: "apexify-72bc2.firebasestorage.app",
          messagingSenderId: "114061131405",
          appId: "1:114061131405:web:ffd00b701d70c164976cc4",
          measurementId: "G-RB6KW4S7JL"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                document.getElementById("userGreeting").innerText = "Hi, " + user.email.split('@')[0];
                const docRef = doc(db, "users", user.uid);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById("dashBalance").innerText = (data.balance || 0).toFixed(2);
                }
            } else {
                window.location.href = "index.html";
            }
        });
    </script>
</body>
</html>

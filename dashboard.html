<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Prime BD</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .dash-container { max-width: 460px; margin: 15px auto; padding: 0 15px; }
        
        /* টপ হেডার */
        .dash-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .support-icon, .notif-icon { width: 40px; height: 40px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .dash-logo { font-size: 20px; font-weight: 800; color: var(--brand-green); display: flex; align-items: center; gap: 6px; }

        /* ব্যানার স্লাইডার */
        .banner-slider { background: #111; border-radius: 20px; overflow: hidden; margin-bottom: 20px; position: relative; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .banner-slider img { width: 100%; display: block; height: 160px; object-fit: cover; opacity: 0.85; }

        /* অ্যাকশন রিকোয়ার্ড বক্স */
        .alert-box { background: #FFF1F2; border: 1px solid #FECDD3; border-radius: 24px; padding: 25px 20px; text-align: center; margin-bottom: 20px; }
        .alert-title { color: #9F1239; font-weight: 800; font-size: 18px; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .alert-desc { color: #4B5563; font-size: 13px; line-height: 1.5; margin-bottom: 20px; }
        .active-btn { background: #E11D48; color: white; border: none; padding: 12px 28px; border-radius: 30px; font-weight: bold; font-size: 14px; cursor: pointer; box-shadow: 0 4px 12px rgba(225, 29, 72, 0.3); }

        /* টোটাল এসেট কার্ড */
        .asset-box { background: linear-gradient(135deg, #0A192F 0%, #0F766E 100%); color: white; border-radius: 24px; padding: 22px; box-shadow: 0 10px 25px rgba(15, 118, 110, 0.25); position: relative; }
        .asset-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .asset-label { font-size: 11px; font-weight: 700; opacity: 0.8; letter-spacing: 0.5px; }
        
        /* কারেন্সি টগল (BDT, USDT, INR) */
        .currency-switch { background: rgba(255, 255, 255, 0.15); border-radius: 20px; padding: 3px; display: flex; gap: 2px; }
        .cur-btn { background: transparent; border: none; color: white; font-size: 11px; font-weight: bold; padding: 4px 10px; border-radius: 15px; cursor: pointer; }
        .cur-btn.active { background: white; color: var(--brand-green); }

        .asset-amount { font-size: 34px; font-weight: 800; margin: 8px 0; }
        .asset-sub { font-size: 12px; opacity: 0.75; }
    </style>
</head>
<body>

    <div class="dash-container">
        <!-- টপ বার -->
        <div class="dash-header">
            <a href="#" class="support-icon">🎧</a>
            <div class="dash-logo">📈 Prime BD</div>
            <a href="#" class="notif-icon">🔔</a>
        </div>

        <!-- ব্যানার স্লাইডার -->
        <div class="banner-slider">
            <img src="https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?auto=format&fit=crop&w=600&q=80" alt="Banner">
        </div>

        <!-- অ্যাকশন রিকোয়ার্ড বক্স -->
        <div class="alert-box">
            <div class="alert-title">⚠️ Action Required!</div>
            <div class="alert-desc">আপনার অ্যাকাউন্ট আনঅ্যাক্টিভ, কাজ শুরু করতে এবং উইথড্র পেতে এখনই অ্যাকাউন্টটি একটিভ করুন।</div>
            <button class="active-btn" onclick="window.location.href='wallet.html'">⚡ ACCOUNT ACTIVE</button>
        </div>

        <!-- টোটাল এসেট কার্ড -->
        <div class="asset-box">
            <div class="asset-top">
                <div class="asset-label">TOTAL ASSET VALUE</div>
                <div class="currency-switch">
                    <button class="cur-btn active">BDT</button>
                    <button class="cur-btn">USDT</button>
                    <button class="cur-btn">INR</button>
                </div>
            </div>
            <div class="asset-amount">৳<span id="dashBalance">0.00</span></div>
            <div class="asset-sub">Your complete PrimeBD account summary</div>
        </div>
    </div>

    <!-- বটম ন্যাভিগেশন বার -->
    <div class="bottom-nav">
        <a href="dashboard.html" class="nav-item active">🏠 Home</a>
        <a href="wallet.html" class="nav-item">👛 Wallet</a>
        <a href="server.html" class="nav-center-btn">💼</a>
        <a href="server.html" class="nav-item">👑 Server</a>
        <a href="profile.html" class="nav-item">👤 Profile</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDsgQJgZ64-ARLqKa3vcdQpu_xVupD90W4",
          authDomain: "apexify-72bc2.firebaseapp.com",
          projectId: "apexify-72bc2",
          storageBucket: "apexify-72bc2.firebasestorage.app",
          messagingSenderId: "114061131405",
          appId: "1:114061131405:web:ffd00b701d70c164976cc4",
          measurementId: "G-RB6KW4S7JL"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const docSnap = await getDoc(doc(db, "users", user.uid));
                if (docSnap.exists()) {
                    document.getElementById("dashBalance").innerText = (docSnap.data().balance || 0).toFixed(2);
                }
            } else {
                window.location.href = "index.html";
            }
        });
    </script>
</body>
</html>

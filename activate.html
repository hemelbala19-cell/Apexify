<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Active - Prime BD</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .activate-container { max-width: 460px; margin: 15px auto; padding: 0 15px; }
        
        /* টপ হেডার */
        .dash-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .support-icon, .notif-icon { width: 40px; height: 40px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .dash-logo { font-size: 20px; font-weight: 800; color: var(--brand-green); display: flex; align-items: center; gap: 6px; }

        /* মূল কার্ড */
        .activate-card { background: white; border-radius: 28px; padding: 30px 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.06); margin-bottom: 20px; }
        
        .wallet-icon-box { width: 60px; height: 60px; background: #F0FDF4; border-radius: 18px; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; font-size: 28px; color: var(--brand-green); box-shadow: 0 4px 10px rgba(15, 118, 110, 0.1); }
        
        .activate-title { font-size: 22px; font-weight: 800; color: #111827; margin-bottom: 8px; }
        .activate-desc { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.4; }
        
        /* ফি ব্যাজ */
        .fee-badge { display: inline-block; background: #F0FDF4; color: var(--brand-green); font-size: 18px; font-weight: 800; padding: 8px 24px; border-radius: 30px; margin-bottom: 25px; border: 1px solid #DCFCE7; }

        /* পেমেন্ট মেথড সিলেকশন বক্স */
        .method-grid { display: flex; gap: 15px; justify-content: center; margin-bottom: 30px; }
        
        .method-option { flex: 1; background: #ffffff; border: 2px solid var(--border-color); border-radius: 20px; padding: 20px 10px; cursor: pointer; transition: 0.2s; text-align: center; }
        .method-option.selected { border-color: var(--brand-green); background: #F9FAFB; box-shadow: 0 4px 15px rgba(15, 118, 110, 0.1); }
        
        .method-logo { width: 50px; height: 50px; object-fit: contain; margin: 0 auto 10px; display: block; border-radius: 10px; }
        .method-name { font-weight: 700; font-size: 14px; color: #1F2937; margin-bottom: 4px; }
        .method-sub { font-size: 11px; color: var(--text-muted); }

        /* এক্টিভ বাটন */
        .pay-activate-btn { width: 100%; background: var(--brand-green); color: white; border: none; padding: 16px; border-radius: 16px; font-weight: bold; font-size: 15px; cursor: pointer; box-shadow: 0 6px 20px rgba(15,118,110,0.3); display: flex; align-items: center; justify-content: center; gap: 8px; }
    </style>
</head>
<body>

    <div class="activate-container">
        <!-- টপ বার -->
        <div class="dash-header">
            <a href="#" class="support-icon">🎧</a>
            <div class="dash-logo">📈 Prime BD</div>
            <a href="#" class="notif-icon">🔔</a>
        </div>

        <!-- মূল কার্ড -->
        <div class="activate-card">
            <div class="wallet-icon-box">👛</div>
            <div class="activate-title">Account Active</div>
            <div class="activate-desc">আপনি কিএস মাধ্যমে payment করতে চান?</div>
            
            <div class="fee-badge">৳ 150</div>

            <!-- মেথড সিলেকশন -->
            <div class="method-grid">
                <div class="method-option selected" onclick="selectMethod(this, 'bkash')">
                    <!-- বিকাশ লোগো বা আইকন -->
                    <div style="background: #E2136E; color: white; font-weight: bold; font-size: 12px; width: 45px; height: 45px; border-radius: 10px; display: flex; align-items: center; justify-content: center; margin: 0 auto 8px;">bKash</div>
                    <div class="method-name">bKash</div>
                    <div class="method-sub">Tap to select</div>
                </div>

                <div class="method-option" onclick="selectMethod(this, 'nagad')">
                    <!-- নগদ লোগো বা আইকন -->
                    <div style="background: #F15A24; color: white; font-weight: bold; font-size: 12px; width: 45px; height: 45px; border-radius: 10px; display: flex; align-items: center; justify-content: center; margin: 0 auto 8px;">নগদ</div>
                    <div class="method-name">Nagad</div>
                    <div class="method-sub">Tap to select</div>
                </div>
            </div>

            <button class="pay-activate-btn" id="confirmPayBtn">🔒 Pay & Activate Account</button>
        </div>
    </div>

    <!-- বটম ন্যাভিগেশন বার -->
    <div class="bottom-nav">
        <a href="dashboard.html" class="nav-item active">🏠 Home</a>
        <a href="wallet.html" class="nav-item">👛 Wallet</a>
        <a href="server.html" class="nav-center-btn">💼</a>
        <a href="server.html" class="nav-item">👑 Server</a>
        <a href="profile.html" class="nav-item">👤 Profile</a>
    </div>

    <script>
        let selectedGateway = "bkash";

        function selectMethod(element, method) {
            document.querySelectorAll('.method-option').forEach(opt => opt.classList.remove('selected'));
            element.classList.add('selected');
            selectedGateway = method;
        }

        document.getElementById("confirmPayBtn").addEventListener("click", () => {
            alert(selectedGateway.toUpperCase() + " এর মাধ্যমে ৳১৫০ পেমেন্ট রিকোয়েস্ট পাঠানো হয়েছে। (এটি ডেমো পেজ)");
            // এখানে পেমেন্ট গেটওয়ে ইন্টিগ্রেশন বা ট্রানজেকশন পেজে রিডাইরেক্ট করতে পারেন
        });
    </script>
</body>
              </html>
